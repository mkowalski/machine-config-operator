mode: 0644
path: {{ if isBGPVIPManagement . }}"/etc/kubernetes/manifests/0000-frr-k8s.yaml"{{ else }}"/etc/kubernetes/disabled-manifests/0000-frr-k8s.yaml"{{ end }}
contents:
  inline: |
    ---
    kind: Pod
    apiVersion: v1
    metadata:
      name: frr-k8s
      namespace: openshift-frr-k8s
      labels:
        app: frr-k8s
    spec:
      hostNetwork: true
      shareProcessNamespace: true
      priorityClassName: system-node-critical
      terminationGracePeriodSeconds: 0
      tolerations:
      - operator: Exists
      initContainers:
      - name: render-config-frr
        image: {{.Images.baremetalRuntimeCfgImage}}
        command:
        - /usr/bin/runtimecfg
        - render
        - /etc/kubernetes/kubeconfig
        - --api-vips
        - {{ onPremPlatformAPIServerInternalIP . }}
        - --ingress-vips
        - {{ onPremPlatformIngressIP . }}
        - /config/frr.conf.tmpl
        - --out-dir
        - /etc/frr
        - --peer-file
        - /config/frr-peers.json
        env:
        - name: IS_BOOTSTRAP
          value: "no"
        resources:
          requests:
            cpu: 10m
            memory: 50Mi
        terminationMessagePolicy: FallbackToLogsOnError
        volumeMounts:
        - name: resource-dir
          mountPath: /config
        - name: frr-conf
          mountPath: /etc/frr
        - name: kubeconfig
          mountPath: /etc/kubernetes
      - name: cp-frr-files
        image: {{.Images.frrK8sImage}}
        command:
        - /bin/sh
        - -c
        - |
          cp -f /tmp/frr/daemons /etc/frr/daemons
          cp -f /tmp/frr/vtysh.conf /etc/frr/vtysh.conf
        securityContext:
          runAsUser: 100
          runAsGroup: 101
        resources:
          requests:
            cpu: 10m
            memory: 20Mi
        terminationMessagePolicy: FallbackToLogsOnError
        volumeMounts:
        - name: frr-startup
          mountPath: /tmp/frr
        - name: frr-conf
          mountPath: /etc/frr
      - name: cp-reloader
        image: {{.Images.frrK8sImage}}
        command:
        - /bin/sh
        - -c
        - cp -f /frr-reloader.sh /etc/frr_reloader/
        resources:
          requests:
            cpu: 10m
            memory: 20Mi
        terminationMessagePolicy: FallbackToLogsOnError
        volumeMounts:
        - name: reloader
          mountPath: /etc/frr_reloader
      - name: cp-frr-status
        image: {{.Images.frrK8sImage}}
        command:
        - /bin/sh
        - -c
        - cp -f /frr-status /etc/frr_status/
        resources:
          requests:
            cpu: 10m
            memory: 20Mi
        terminationMessagePolicy: FallbackToLogsOnError
        volumeMounts:
        - name: frr-status
          mountPath: /etc/frr_status
      containers:
      - name: controller
        image: {{.Images.frrK8sImage}}
        command:
        - /frr-k8s
        args:
        - --node-name=$(NODE_NAME)
        - --namespace=openshift-frr-k8s
        env:
        - name: FRR_CONFIG_FILE
          value: /etc/frr_reloader/frr.conf
        - name: FRR_RELOADER_PID_FILE
          value: /etc/frr_reloader/reloader.pid
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: KUBECONFIG
          value: /etc/kubernetes/kubeconfig
        resources:
          requests:
            cpu: 100m
            memory: 200Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
            add:
            - NET_RAW
        livenessProbe:
          httpGet:
            path: /healthz
            port: 7572
            host: 127.0.0.1
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /readyz
            port: 7572
            host: 127.0.0.1
          initialDelaySeconds: 10
          periodSeconds: 10
        terminationMessagePolicy: FallbackToLogsOnError
        volumeMounts:
        - name: reloader
          mountPath: /etc/frr_reloader
        - name: kubeconfig
          mountPath: /etc/kubernetes
          readOnly: true
      - name: frr
        image: {{.Images.frrK8sImage}}
        command:
        - /bin/sh
        - -c
        - /sbin/tini -- /usr/lib/frr/docker-start
        env:
        - name: TINI_SUBREAPER
          value: "true"
        resources:
          requests:
            cpu: 100m
            memory: 200Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            add:
            - NET_ADMIN
            - NET_RAW
            - SYS_ADMIN
            - NET_BIND_SERVICE
        terminationMessagePolicy: FallbackToLogsOnError
        volumeMounts:
        - name: frr-sockets
          mountPath: /var/run/frr
        - name: frr-conf
          mountPath: /etc/frr
        - name: frr-lib
          mountPath: /var/lib/frr
        - name: frr-tmp
          mountPath: /var/tmp/frr
      - name: reloader
        image: {{.Images.frrK8sImage}}
        command:
        - /etc/frr_reloader/frr-reloader.sh
        resources:
          requests:
            cpu: 10m
            memory: 20Mi
        terminationMessagePolicy: FallbackToLogsOnError
        volumeMounts:
        - name: frr-sockets
          mountPath: /var/run/frr
        - name: frr-conf
          mountPath: /etc/frr
        - name: reloader
          mountPath: /etc/frr_reloader
      - name: frr-status
        image: {{.Images.frrK8sImage}}
        command:
        - /etc/frr_status/frr-status
        args:
        - --node-name=$(NODE_NAME)
        - --namespace=openshift-frr-k8s
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: KUBECONFIG
          value: /etc/kubernetes/kubeconfig
        resources:
          requests:
            cpu: 10m
            memory: 20Mi
        terminationMessagePolicy: FallbackToLogsOnError
        volumeMounts:
        - name: frr-sockets
          mountPath: /var/run/frr
        - name: frr-conf
          mountPath: /etc/frr
        - name: frr-status
          mountPath: /etc/frr_status
        - name: kubeconfig
          mountPath: /etc/kubernetes
          readOnly: true
      volumes:
      - name: resource-dir
        hostPath:
          path: /etc/kubernetes/static-pod-resources/frr-k8s
      - name: frr-conf
        emptyDir: {}
      - name: frr-sockets
        emptyDir: {}
      - name: reloader
        emptyDir: {}
      - name: frr-status
        emptyDir: {}
      - name: frr-lib
        emptyDir: {}
      - name: frr-tmp
        emptyDir: {}
      - name: frr-startup
        hostPath:
          path: /etc/kubernetes/static-pod-resources/frr-k8s/startup
      - name: kubeconfig
        hostPath:
          path: /etc/kubernetes
