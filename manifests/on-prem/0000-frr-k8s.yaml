---
kind: Pod
apiVersion: v1
metadata:
  name: frr-k8s
  namespace: openshift-frr-k8s
  labels:
    app: frr-k8s
spec:
  hostNetwork: true
  shareProcessNamespace: true
  priorityClassName: system-node-critical
  terminationGracePeriodSeconds: 0
  tolerations:
  - operator: Exists
  initContainers:
  - name: render-config-frr
    image: {{ .Images.BaremetalRuntimeCfgBootstrap }}
    command:
    - /usr/bin/runtimecfg
    - render
    - /etc/kubernetes/kubeconfig
    - --api-vips
    - {{ onPremPlatformAPIServerInternalIP .ControllerConfig }}
    - --ingress-vips
    - {{ onPremPlatformIngressIP .ControllerConfig }}
    - "--cluster-config"
    - "/opt/openshift/manifests/cluster-config.yaml"
    - /config/frr.conf.tmpl
    - --out-dir
    - /etc/frr
    - --peer-file
    - /config/frr-peers.json
    env:
    - name: IS_BOOTSTRAP
      value: "yes"
    resources:
      requests:
        cpu: 10m
        memory: 50Mi
    terminationMessagePolicy: FallbackToLogsOnError
    volumeMounts:
    - name: resource-dir
      mountPath: /config
    - name: frr-conf
      mountPath: /etc/frr
    - name: kubeconfig
      mountPath: /etc/kubernetes
    - name: manifests
      mountPath: "/opt/openshift/manifests"
      mountPropagation: HostToContainer
  - name: cp-frr-files
    image: {{ .Images.FRRK8sBootstrap }}
    command:
    - /bin/sh
    - -c
    - |
      cp -f /tmp/frr/daemons /etc/frr/daemons
      cp -f /tmp/frr/vtysh.conf /etc/frr/vtysh.conf
    securityContext:
      runAsUser: 100
      runAsGroup: 101
    resources:
      requests:
        cpu: 10m
        memory: 20Mi
    terminationMessagePolicy: FallbackToLogsOnError
    volumeMounts:
    - name: frr-startup
      mountPath: /tmp/frr
    - name: frr-conf
      mountPath: /etc/frr
  containers:
  - name: frr
    image: {{ .Images.FRRK8sBootstrap }}
    command:
    - /bin/sh
    - -c
    - /sbin/tini -- /usr/lib/frr/docker-start
    env:
    - name: TINI_SUBREAPER
      value: "true"
    resources:
      requests:
        cpu: 100m
        memory: 200Mi
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        add:
        - NET_ADMIN
        - NET_RAW
        - SYS_ADMIN
        - NET_BIND_SERVICE
    terminationMessagePolicy: FallbackToLogsOnError
    volumeMounts:
    - name: frr-sockets
      mountPath: /var/run/frr
    - name: frr-conf
      mountPath: /etc/frr
    - name: frr-lib
      mountPath: /var/lib/frr
    - name: frr-tmp
      mountPath: /var/tmp/frr
  volumes:
  - name: resource-dir
    hostPath:
      path: /etc/kubernetes/static-pod-resources/frr-k8s
  - name: frr-conf
    emptyDir: {}
  - name: frr-sockets
    emptyDir: {}
  - name: frr-lib
    emptyDir: {}
  - name: frr-tmp
    emptyDir: {}
  - name: frr-startup
    hostPath:
      path: /etc/kubernetes/static-pod-resources/frr-k8s/startup
  - name: kubeconfig
    hostPath:
      path: /etc/kubernetes
  - name: manifests
    hostPath:
      path: "/opt/openshift/manifests"
